name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mongodb:
        # MongoDB 8's allocator rejects the hosted runner kernel; test the 7.0 baseline here.
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Go checks and standalone MongoDB integration
        working-directory: backend
        env:
          MONEYBAG_TEST_MONGO_URI: mongodb://127.0.0.1:27017/moneybag_test_ci
        run: |
          test -z "$(gofmt -l cmd internal integration)"
          go test ./...
          go vet ./...
          go build -o bin/moneybag ./cmd/api
          go build -o bin/moneybag-mcp ./cmd/mcp
      - name: Browser dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser workflows
        env:
          MONEYBAG_LISTEN: 127.0.0.1:6460
          MONEYBAG_PUBLIC_URL: http://127.0.0.1:6460
          MONEYBAG_MONGO_URI: mongodb://127.0.0.1:27017/moneybag_qa
          MONEYBAG_MONGO_DB: moneybag_qa
          MONEYBAG_SETUP_TOKEN: synthetic-preview-token
          MONEYBAG_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          export MONEYBAG_CHROMIUM_BIN="$(cd e2e && node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')"
          backend/bin/moneybag > /tmp/moneybag-qa.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:6460/healthz && break || sleep 1; done
          (cd e2e && npm test)
