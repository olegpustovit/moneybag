name: UI and embedded application
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make check
      - run: make build
      - run: make test-integration
        timeout-minutes: 6
  speed-budget:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: moneybag_speed_ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: e2e/speed-budget-ci.sh
        timeout-minutes: 6
        env:
          MONEYBAG_E2E_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/moneybag_speed_ci
          CHROMIUM_BIN: /usr/bin/google-chrome
