<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect a bank feed</title><script src="/theme.js"></script><link rel="stylesheet" href="{{asset "auth.css"}}"></head>
<body><main class="auth"><a class="brand auth-brand" href="/"><span class="logo">M</span><span>Moneybag</span></a><h1>Connect a bank feed</h1>
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
<p>Paste the credential from your bank here. It is stored encrypted, and agents can use the feed without ever seeing it.</p>
<form method="post" action="{{.Action}}" class="stack"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Bank credential<input class="in" type="password" name="token" required maxlength="8192" autocomplete="off"></label><button class="btn" type="submit">Save</button></form></main></body></html>
